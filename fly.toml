# Fly.io Deployment Config — PixelCompute Town (像素算力鎮)
# Deploy with:
#   fly launch --no-deploy
#   fly volumes create pixel_town_data --region sin --size 1
#   fly secrets set APP_BASE_URL=https://pixel-compute-town.fly.dev GITHUB_CLIENT_ID=... GITHUB_CLIENT_SECRET=...
#   fly deploy

app = "pixel-compute-town"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  HOST = "0.0.0.0"
  PORT = "3456"
  PIXEL_DATA_DIR = "/app/data"

[http_service]
  internal_port = 3456
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/api/health"

[[mounts]]
  source = "pixel_town_data"
  destination = "/app/data"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
