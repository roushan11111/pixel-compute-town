# Render Blueprint — One-Click Alpha Deployment for PixelCompute Town
# Docs: https://docs.render.com/blueprint-spec
services:
  - type: web
    name: pixel-compute-town
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "3456"
      - key: PIXEL_DATA_DIR
        value: /app/data
      - key: APP_BASE_URL
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: TREASURY_EVM_ADDRESS
        sync: false
      - key: TREASURY_SOL_ADDRESS
        sync: false
      - key: TREASURY_TRON_ADDRESS
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: POLAR_WEBHOOK_SECRET
        sync: false
    # Upgrade to Starter plan and uncomment below to persist data/state.json across redeploys:
    # disk:
    #   name: pixel-town-data
    #   mountPath: /app/data
    #   sizeGB: 1
